<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ropa de Moda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Sarah's Style</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-link nav-link" onclick="mostrarModal('login')">
                            Login
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>

        <section class="container my-5">
            <h2 class="text-center mb-4">Catálogo</h2>

            <div class="row g-4">

                <!-- Producto 1 -->
                <div class="col-md-4">
                    <div class="card producto-card h-100">
                        <img src="assets/img/zapatillas.jpg" class="card-img-top producto-img" alt="Zapatillas">
                        <div class="card-body text-center">
                            <h5 class="card-title">Zapatillas</h5>
                            <p class="card-text">$25.990</p>
                            <button class="btn btn-primary" onclick="agregarProducto(1)">
                                Agregar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Producto 2 -->
                <div class="col-md-4">
                    <div class="card producto-card h-100">
                        <img src="assets/img/jeans.jpg" class="card-img-top producto-img" alt="Jeans">
                        <div class="card-body text-center">
                            <h5 class="card-title">Jeans</h5>
                            <p class="card-text">$12.990</p>
                            <button class="btn btn-primary" onclick="agregarProducto(2)">
                                Agregar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Producto 3 -->
                <div class="col-md-4">
                    <div class="card producto-card h-100">
                        <img src="assets/img/polera.jpg" class="card-img-top producto-img" alt="Polera">
                        <div class="card-body text-center">
                            <h5 class="card-title">Polera</h5>
                            <p class="card-text">$9.990</p>
                            <button class="btn btn-primary" onclick="agregarProducto(3)">
                                Agregar
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <section class="container my-5">
            <h2 class="text-center mb-4">Carrito</h2>

            <div class="table-responsive">
                <table class="table text-center align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="carrito-body">
                    </tbody>
                </table>
            </div>

            <!-- Código descuento -->
            <div class="row mt-3">
                <div class="col-md-6">
                    <input type="text" id="codigo" class="form-control" placeholder="Código descuento">
                </div>
                <div class="col-md-6">
                    <button class="btn btn-success w-100" onclick="aplicarCodigo()">
                        Aplicar descuento
                    </button>
                </div>
            </div>

            <!-- Total -->
            <p class="mt-3 text-end">
                <strong>Total:</strong> <span id="total">$0</span>
            </p>
        </section>

    </main>

    <div class="modal fade" id="modalAuth" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Iniciar sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="text" id="usuario" class="form-control mb-3" placeholder="Usuario">
                    <input type="password" id="password" class="form-control" placeholder="Contraseña">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="login()">
                        Ingresar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-4">
        <small>© 2025 · Mi tienda</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
